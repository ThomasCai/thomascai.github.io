        **技术栈：** DeepSeek, RAG, LangChain、SQL优化
    
    - name: 多模态模型算法构建与部署
      image: 'images/portfolio/multimodal.png'
      url: '#'
      description: |
        基于 CLIP 与 Transformer 架构研发多模态智能标注与检索系统。

        **核心成果：**

        - 基于 CLIP 研发多模态辅助标注系统，实现图文跨模态多标签分类  
