      image: 'images/portfolio/industrial_count.png'
      url: '#'
      description: |
        基于目标检测与多目标跟踪技术构建的端到端工业产线计数系统，实现瓶体检测、跟踪与去重的自动化处理。

        • 设计连续帧分析与 ROI 划分算法，有效抑制悬挂物干扰，计数准确率超 98%，实际误差低于 0.5%  
        • 基于 TensorRT 优化模型推理，速度提升 100%（150 FPS → 300 FPS，RTX 3080Ti）  
        • 系统成功部署并稳定运行，获客户高度认可，支撑项目关键阶段交付  

        **技术栈：** 目标检测, 多目标跟踪, TensorRT, DeepSORT

    - name: 昇腾AI工业质检算法优化
      image: 'images/portfolio/ascend_ai.png'
      url: '#'
      description: |
        从 0 到 1 构建适配昇腾 AI 芯片的工业质检目标检测算法，覆盖 YOLOv4 与 SSD 模型的训练与推理优化。

        • 基于 MindSpore 与 CANN 进行模型适配与性能调优，YOLOv4 训练时间由 22h 降至 6.6h（↓70%），SSD 由 18h 降至 5.8h（↓68%）  
        • 模型 mAP 稳定在 99%+，成功部署于 6 个工业客户场景，覆盖 50+ 条产线  
        • 负责昇腾训推一体机训练侧对接与联调，推动首个昇腾端工业质检端到端闭环方案落地  

        **技术栈：** YOLOv4, SSD, MindSpore, CANN, 昇腾 AI 芯片, Python, Shell


