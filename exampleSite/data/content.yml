########################### About ##################################
about:
  enable: true
  image: 'images/profile.jpg'
  title: '关于我'
  content: |
    你好，我是**蔡天任**，一名专注于计算机视觉、目标检测与多模态应用以及大模型开发的算法工程师。
    
    拥有 6 年算法研发经验，主导多个视觉检测、分割及大模型项目从 0 到 1 落地。
    
    **核心技能：**
    - 深度学习：YOLO 系列、Transformer、CLIP、SAM、多模态学习
    - 工程化部署：ONNX、TensorRT、算子融合、C++ 推理封装
    - 系统优化：模型轻量化、吞吐率提升、推理加速
    - 管理与协作：小团队带领、技术规划、跨部门交付
    
    我相信"**研究与落地并重，算法应解决真实问题**"。目前专注于高性能视觉系统与大模型应用的产业落地。
